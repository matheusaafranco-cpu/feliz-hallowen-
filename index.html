<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Halloween!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #ff6600;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }

        .container {
            text-align: center;
            background: #1a1a1a;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.5);
            border: 2px solid #ff6600;
            position: relative;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px #000;
        }

        .botoes {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            height: 50px;
            position: relative;
        }

        button {
            padding: 12px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #btnSim {
            background-color: #ff6600;
            color: #fff;
        }

        #btnNao {
            background-color: #333;
            color: #ff6600;
            border: 1px solid #ff6600;
            position: absolute;
        }

        /* Classe secreta do susto */
        .tela-susto {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .tela-susto img {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }

        /* Efeito piscante agressivo */
        .piscar-alerta {
            animation: flashEstourado 0.08s infinite alternate;
        }

        @keyframes flashEstourado {
            0% { background-color: #ff0000; }     /* Vermelho puro */
            100% { background-color: #000000; }   /* Preto total */
        }
    </style>
</head>
<body>

    <div class="container" id="conteudoPrincipal">
        <h1 id="pergunta">¿Quer comemorar o hallowen comigo ? 🎃</h1>
        <div class="botoes">
            <button id="btnSim" onclick="iniciarSuspense()">Sim:)</button>
            <button id="btnNao" onmouseover="fuga()" onclick="fuga()">Não:(</button>
        </div>
    </div>

    <!-- Div do susto -->
    <div id="janelaSusto" class="tela-susto">
        <img id="imagemSusto" src="https://giphy.com" alt="BOO!">
    </div>

    <!-- Áudio de grito real e estourado -->
    <audio id="somSusto" src="https://soundjay.com" preload="auto"></audio>

    <script>
        const btnNao = document.getElementById('btnNao');
        const conteudoPrincipal = document.getElementById('conteudoPrincipal');
        const janelaSusto = document.getElementById('janelaSusto');
        const somSusto = document.getElementById('somSusto');

        function fuga() {
            const larguraJanela = window.innerWidth - 100;
            const alturaJanela = window.innerHeight - 50;
            const novoX = Math.floor(Math.random() * larguraJanela);
            const novoY = Math.floor(Math.random() * alturaJanela);

            btnNao.style.position = 'fixed';
            btnNao.style.left = novoX + 'px';
            btnNao.style.top = novoY + 'px';
        }

        // 1ª FASE: Suspense silencioso
        function iniciarSuspense() {
            conteudoPrincipal.style.display = 'none';
            document.body.style.backgroundColor = 'black';
            setTimeout(dispararSusto, 3000); 
        }

        // 2ª FASE: O susto com o efeito piscante ativado
        function dispararSusto() {
            janelaSusto.style.display = 'flex';
            
            // Adiciona a animação de piscar na tela inteira do susto
            janelaSusto.classList.add('piscar-alerta');
            
            somSusto.volume = 1.0; 
            somSusto.play().catch(e => console.log("O navegador bloqueou o som automático."));

            // Mantém o caos por 4 segundos e reseta para a tela inicial
            setTimeout(voltarTelaAnterior, 4000);
        }

        // Restaura o jogo para o estado inicial
        function voltarTelaAnterior() {
            janelaSusto.style.display = 'none';
            
            // Remove o efeito piscante para a tela inicial não ficar bugada
            janelaSusto.classList.remove('piscar-alerta');
            
            somSusto.pause();
            somSusto.currentTime = 0; 

            document.body.style.backgroundColor = '#111';
            conteudoPrincipal.style.display = 'block';

            btnNao.style.position = 'absolute';
            btnNao.style.left = 'auto';
            btnNao.style.top = 'auto';
        }
    </script>

</body>
</html>
